<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旅行規劃</title>
<style>
:root{
  --sage:#a8b5a2; --rose:#c9a9a6; --sand:#d9cfc4;
  --sky:#9fb4c7; --lavender:#b3adc7; --peach:#d4b8a8;
  --cream:#f5f2ee; --paper:#faf8f5; --ink:#4a4440;
  --ink-soft:#8c837c; --line:#e0d9d2;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--cream);color:var(--ink);
  font-family:"PingFang TC","Hiragino Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15px;line-height:1.7;min-height:100vh}

/* hero */
.hero{
  background:linear-gradient(135deg,#c9d8c5 0%,#c9b8c4 45%,#b8c9d8 100%);
  padding:56px 24px 48px;text-align:center;position:relative;overflow:hidden;
}
.hero::before{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 70% 30%,rgba(255,255,255,.22) 0%,transparent 60%)}
.hero-icon{font-size:36px;margin-bottom:12px;display:block;position:relative}
.hero h1{font-family:"Songti TC","Noto Serif CJK TC",serif;font-size:30px;font-weight:600;
  letter-spacing:.04em;color:#fff;text-shadow:0 1px 6px rgba(100,80,70,.18);position:relative}
.hero p{margin-top:8px;font-size:13.5px;color:rgba(255,255,255,.8);
  letter-spacing:.06em;position:relative}

/* filters */
.filters{max-width:900px;margin:0 auto;padding:22px 24px 0}
.filter-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.filter-label{font-size:11.5px;letter-spacing:.1em;color:var(--ink-soft);
  font-family:ui-monospace,monospace;min-width:40px}
.tab{border:1px solid var(--line);background:var(--paper);border-radius:20px;
  padding:5px 15px;font-size:13px;cursor:pointer;color:var(--ink-soft);
  transition:.18s;font-family:inherit}
.tab:hover{border-color:var(--sage);color:var(--ink)}
.tab.on{background:var(--sage);border-color:var(--sage);color:#fff}

/* view toggle */
.toolbar{max-width:900px;margin:0 auto;padding:14px 24px 0;
  display:flex;justify-content:flex-end;gap:8px}
.vtog{border:1px solid var(--line);background:var(--paper);border-radius:8px;
  padding:6px 14px;font-size:12.5px;cursor:pointer;color:var(--ink-soft);
  font-family:inherit;transition:.18s}
.vtog.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* wrap */
.wrap{max-width:900px;margin:0 auto;padding:16px 24px 60px}

/* ── grid view ── */
#view-grid{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;
  overflow:hidden;text-decoration:none;color:inherit;
  display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;cursor:pointer}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(100,85,75,.1)}
.card-band{height:6px}
.card-body{padding:18px 18px 16px;flex:1;display:flex;flex-direction:column}
.card-tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-soft);font-family:ui-monospace,monospace;margin-bottom:8px}
.card h2{font-family:"Songti TC","Noto Serif CJK TC",serif;
  font-size:18px;font-weight:600;line-height:1.4;margin-bottom:6px}
.card p{font-size:13px;color:var(--ink-soft);line-height:1.6;flex:1}
.card-meta{margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:11.5px;padding:3px 10px;border-radius:10px;
  border:1px solid var(--line);color:var(--ink-soft);white-space:nowrap}
.arrow{margin-left:auto;font-size:13px;color:var(--ink-soft)}
.card-add{border:1px dashed var(--line);background:transparent;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 18px;color:var(--ink-soft);font-size:13px;gap:8px;min-height:160px}
.card-add span{font-size:26px}

/* ── timeline view ── */
#view-timeline{display:none}
.timeline{position:relative;padding-left:28px}
.timeline::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;
  width:2px;background:var(--line);border-radius:1px}
.tl-year{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.12em;
  color:var(--ink-soft);margin:28px 0 14px;padding-left:6px;position:relative}
.tl-year::before{content:'';position:absolute;left:-25px;top:50%;
  transform:translateY(-50%);width:10px;height:10px;
  border-radius:50%;background:var(--sand);border:2px solid var(--ink-soft)}
.tl-item{position:relative;margin-bottom:14px;cursor:pointer}
.tl-item::before{content:'';position:absolute;left:-22px;top:18px;
  width:8px;height:8px;border-radius:50%;background:var(--sage);
  border:2px solid var(--paper);box-shadow:0 0 0 1px var(--sage);transition:.2s}
.tl-item:hover::before{transform:scale(1.3)}
.tl-card{background:var(--paper);border:1px solid var(--line);border-radius:10px;
  padding:14px 16px;display:flex;gap:14px;align-items:flex-start;
  transition:box-shadow .2s,transform .2s}
.tl-card:hover{box-shadow:0 4px 16px rgba(100,85,75,.1);transform:translateX(3px)}
.tl-dot-color{width:4px;min-width:4px;border-radius:2px;align-self:stretch}
.tl-content{flex:1}
.tl-date{font-family:ui-monospace,monospace;font-size:11px;color:var(--ink-soft);
  letter-spacing:.08em;margin-bottom:4px}
.tl-title{font-family:"Songti TC","Noto Serif CJK TC",serif;
  font-size:16px;font-weight:600;line-height:1.4}
.tl-desc{font-size:13px;color:var(--ink-soft);margin-top:4px}
.tl-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tl-empty{color:var(--ink-soft);font-size:13.5px;padding:20px 0;text-align:center}

/* empty state */
.empty-state{text-align:center;padding:48px 24px;color:var(--ink-soft)}
.empty-state .big{font-size:36px;margin-bottom:12px}
.empty-state p{font-size:14px}

/* detail panel (slide-in) */
.overlay{display:none;position:fixed;inset:0;background:rgba(74,68,64,.35);z-index:100}
.overlay.show{display:block}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(420px,100vw);
  background:var(--paper);box-shadow:-4px 0 32px rgba(74,68,64,.12);
  z-index:101;overflow-y:auto;transform:translateX(100%);transition:transform .3s ease}
.panel.show{transform:translateX(0)}
.panel-head{padding:28px 24px 20px;border-bottom:1px solid var(--line)}
.panel-close{float:right;background:none;border:none;font-size:20px;
  cursor:pointer;color:var(--ink-soft);line-height:1;padding:0}
.panel-tag{font-size:11px;letter-spacing:.14em;color:var(--ink-soft);
  font-family:ui-monospace,monospace;margin-bottom:8px}
.panel h2{font-family:"Songti TC","Noto Serif CJK TC",serif;
  font-size:22px;font-weight:600;line-height:1.4}
.panel-body{padding:20px 24px}
.panel-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.panel-section{margin-bottom:20px}
.panel-section h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-soft);font-family:ui-monospace,monospace;margin-bottom:8px}
.panel-section p{font-size:14px;line-height:1.7}
.panel-link{display:inline-block;margin-top:4px;color:var(--sky);
  font-size:13.5px;text-decoration:none;border-bottom:1px solid var(--sky)}

footer{border-top:1px solid var(--line);padding:20px 24px;text-align:center;
  font-size:12px;color:var(--ink-soft);letter-spacing:.06em}
</style>
</head>
<body>

<div class="hero">
  <span class="hero-icon">✈️</span>
  <h1>旅行規劃</h1>
  <p>每一段旅程，都值得好好記下來</p>
</div>

<div class="filters">
  <div class="filter-row">
    <span class="filter-label">年份</span>
    <button class="tab on" data-f="year" data-v="all">全部</button>
  </div>
  <div class="filter-row">
    <span class="filter-label">洲別</span>
    <button class="tab on" data-f="continent" data-v="all">全部</button>
    <button class="tab" data-f="continent" data-v="亞洲">亞洲</button>
    <button class="tab" data-f="continent" data-v="歐洲">歐洲</button>
    <button class="tab" data-f="continent" data-v="美洲">美洲</button>
    <button class="tab" data-f="continent" data-v="大洋洲">大洋洲</button>
    <button class="tab" data-f="continent" data-v="非洲">非洲</button>
  </div>
</div>

<div class="toolbar">
  <button class="vtog on" id="btn-grid">⊞ 卡片</button>
  <button class="vtog" id="btn-tl">◎ 時間軸</button>
</div>

<div class="wrap">
  <!-- grid view -->
  <div id="view-grid">
    <div class="grid" id="grid">
      <div class="card-add"><span>＋</span>旅程即將加入</div>
    </div>
  </div>

  <!-- timeline view -->
  <div id="view-timeline">
    <div class="timeline" id="timeline">
      <div class="tl-empty">還沒有旅程紀錄，卡片加入後會在這裡顯示。</div>
    </div>
  </div>
</div>

<!-- detail panel -->
<div class="overlay" id="overlay"></div>
<div class="panel" id="panel">
  <div class="panel-head">
    <button class="panel-close" id="panel-close">✕</button>
    <div class="panel-tag" id="p-tag"></div>
    <h2 id="p-title"></h2>
  </div>
  <div class="panel-body">
    <div class="panel-meta" id="p-meta"></div>
    <div class="panel-section">
      <h3>行程簡介</h3>
      <p id="p-desc"></p>
    </div>
    <div class="panel-section" id="p-link-wrap" style="display:none">
      <h3>詳細行程</h3>
      <a class="panel-link" id="p-link" href="#" target="_blank">開啟行程頁面 →</a>
    </div>
  </div>
</div>

<footer>旅行是最好的投資 · Travel Planning</footer>

<script>
/* ── 旅程資料（之後在這裡新增） ──
   格式範例：
   {
     id: 1,
     title: '京都春遊',
     year: 2025,
     continent: '亞洲',
     country: '日本',
     season: '春季',
     days: 7,
     desc: '行程簡介文字',
     color: '--sage',   // --sage / --rose / --sky / --lavender / --peach / --sand
     href: 'kyoto.html' // 留空則不顯示連結
   }
*/
const TRIPS = [
  {
    id: 1,
    title: '義大利旅遊手冊',
    year: 2025,
    continent: '歐洲',
    country: '義大利',
    season: '春季',
    days: 15,
    desc: '從羅馬到托斯卡尼，藝術、美食與悠閒午後的完美旅程。',
    color: '--rose',
    href: 'italia.html'
  }
];

/* ── 動態產生年份 tab ── */
function cssVar(v){ return getComputedStyle(document.documentElement).getPropertyValue(v); }
function tripColor(t){ return cssVar(t.color||'--sage'); }

let filterYear='all', filterContinent='all';

function buildYearTabs(){
  const years=[...new Set(TRIPS.map(t=>t.year))].sort((a,b)=>b-a);
  const row=document.querySelector('[data-f="year"]').parentElement;
  years.forEach(y=>{
    const b=document.createElement('button');
    b.className='tab'; b.dataset.f='year'; b.dataset.v=y; b.textContent=y;
    row.appendChild(b);
  });
}

function filtered(){
  return TRIPS.filter(t=>
    (filterYear==='all'||t.year==filterYear)&&
    (filterContinent==='all'||t.continent===filterContinent)
  );
}

/* ── render grid ── */
function renderGrid(){
  const g=document.getElementById('grid'); g.innerHTML='';
  const list=filtered();
  if(list.length===0){
    g.innerHTML='<div class="card-add"><span>＋</span>旅程即將加入</div>';
    return;
  }
  list.forEach(t=>{
    const c=document.createElement('div');
    c.className='card'; c.dataset.id=t.id;
    c.innerHTML=`
      <div class="card-band" style="background:${tripColor(t)}"></div>
      <div class="card-body">
        <div class="card-tag">${t.year} · ${t.country||t.continent}</div>
        <h2>${t.title}</h2>
        <p>${t.desc||''}</p>
        <div class="card-meta">
          ${t.season?`<span class="pill">${t.season}</span>`:''}
          ${t.days?`<span class="pill">${t.days} 天</span>`:''}
          <span class="arrow">→</span>
        </div>
      </div>`;
    c.onclick=()=>openPanel(t);
    g.appendChild(c);
  });
}

/* ── render timeline ── */
function renderTimeline(){
  const tl=document.getElementById('timeline'); tl.innerHTML='';
  const list=[...filtered()].sort((a,b)=>b.year-a.year||0);
  if(list.length===0){
    tl.innerHTML='<div class="tl-empty">還沒有旅程紀錄，加入後會在這裡顯示。</div>';
    return;
  }
  let curYear=null;
  list.forEach(t=>{
    if(t.year!==curYear){
      curYear=t.year;
      const y=document.createElement('div');
      y.className='tl-year'; y.textContent=curYear;
      tl.appendChild(y);
    }
    const item=document.createElement('div');
    item.className='tl-item';
    item.innerHTML=`
      <div class="tl-card">
        <div class="tl-dot-color" style="background:${tripColor(t)}"></div>
        <div class="tl-content">
          <div class="tl-date">${t.country||t.continent}</div>
          <div class="tl-title">${t.title}</div>
          ${t.desc?`<div class="tl-desc">${t.desc}</div>`:''}
          <div class="tl-pills">
            ${t.season?`<span class="pill">${t.season}</span>`:''}
            ${t.days?`<span class="pill">${t.days} 天</span>`:''}
          </div>
        </div>
      </div>`;
    item.onclick=()=>openPanel(t);
    tl.appendChild(item);
  });
}

function render(){ renderGrid(); renderTimeline(); }

/* ── panel ── */
function openPanel(t){
  document.getElementById('p-tag').textContent=`${t.year} · ${t.country||t.continent}`;
  document.getElementById('p-title').textContent=t.title;
  document.getElementById('p-desc').textContent=t.desc||'—';
  const meta=document.getElementById('p-meta');
  meta.innerHTML=[t.season,t.days?t.days+'天':null,t.continent].filter(Boolean)
    .map(v=>`<span class="pill">${v}</span>`).join('');
  const lw=document.getElementById('p-link-wrap');
  if(t.href){ lw.style.display=''; document.getElementById('p-link').href=t.href; }
  else lw.style.display='none';
  document.getElementById('overlay').classList.add('show');
  document.getElementById('panel').classList.add('show');
}
function closePanel(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('panel').classList.remove('show');
}
document.getElementById('overlay').onclick=closePanel;
document.getElementById('panel-close').onclick=closePanel;

/* ── tabs ── */
document.addEventListener('click',e=>{
  const t=e.target.closest('.tab'); if(!t) return;
  const f=t.dataset.f, v=t.dataset.v;
  t.parentElement.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');
  if(f==='year') filterYear=v;
  if(f==='continent') filterContinent=v;
  render();
});

/* ── view toggle ── */
document.getElementById('btn-grid').onclick=()=>{
  document.getElementById('view-grid').style.display='';
  document.getElementById('view-timeline').style.display='none';
  document.getElementById('btn-grid').classList.add('on');
  document.getElementById('btn-tl').classList.remove('on');
};
document.getElementById('btn-tl').onclick=()=>{
  document.getElementById('view-grid').style.display='none';
  document.getElementById('view-timeline').style.display='';
  document.getElementById('btn-grid').classList.remove('on');
  document.getElementById('btn-tl').classList.add('on');
};

/* ── boot ── */
buildYearTabs();
render();
</script>
</body>
</html>
